{% extends 'posts/base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-lg border-0 material-card p-4">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold text-primary">Create an account</h2>
                    <a href="{% url 'login' %}" class="btn btn-outline-primary btn-sm">Already a member?</a>
                </div>
                <p class="text-muted mb-4">Join our tech community to start sharing your insights and useful tips</p>
                <form method="post">
                    {% csrf_token %}
                    {{form|crispy}}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg shadow-sm">Sign Up</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="text-center mt-3">
            <small class="text-muted">By registering, you agree to our community guidelines.</small>
        </div>
    </div>
</div>
{% endblock %}
