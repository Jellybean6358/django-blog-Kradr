{% extends 'posts/base.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-lg border-0 material-card">
            <div class="card-body p-5">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item">
                            <a href="{% url 'post_list' %}">Home</a>
                        </li>
                        <li class="breadcrumb-item active" aria-current="page">Post Detail</li>
                    </ol>
                </nav>
                <h1 class="display-4 fw-bold text-primary mb-3">{{post.title}}</h1>
                <p class="text-muted mb-4">Published:{{post.created_date|date:"F d, Y"}}</p>
                <hr>
                <div class="post-content mt-4 lead">{{post.text|linebreaks}}</div>
                <div class="mt-5 pt-3 border-top">
                    <a href="{% url 'post_edit' pk=post.pk %}" class="btn btn-warning btn-material">Edit</a>
                    <a href="{% url 'post_delete' pk=post.pk %}" class="btn btn-outline-danger btn-material ms-2">Delete</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
