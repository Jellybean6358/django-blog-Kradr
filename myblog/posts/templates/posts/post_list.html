{% extends 'posts/base.html' %} 
{% block content %}
<div class="row">
    {% for post in posts %}
    <div class="col-md-6 col-lg-4 mb-4">
        <div class="card h-100 shadow-sm material-card">
            <div class="card-body">
                <h5 class="card-title fw-bold text-primary">{{post.title}}</h5>
                <p class="card-text text-secondary">{{post.text|truncatewords:20}}</p>
                <div class="d-flex justify-content-between align-items-center mt-3">
                    <a href="{% url 'post_detail' pk=post.pk %}" class="btn btn-sm btn-primary">Read more</a>
                    <small class="text-muted">{{post.created_date|timesince}} ago</small>
                </div>  
            </div>
        </div>
    </div>
{% endfor %} 
</div>
{% endblock %}
